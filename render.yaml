services:
  - type: web
    name: rag-chatbot
    runtime: python
    plan: free
    rootDir: rag_chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FIRST_ADMIN_ID
        sync: false
      - key: SQL_METADATA_SOURCE
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./rag_chatbot.db
